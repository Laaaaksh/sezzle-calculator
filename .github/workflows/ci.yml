name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI only reads code and uploads artifacts.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment) so a moved tag cannot change what runs.
env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      # Fetch the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the Go version declared in go.mod and cache modules keyed on go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Generate gomock mocks; test files import them, so this must run before the tidy check, lint and test.
      - name: Generate mocks
        run: make mock

      # Fail if go.mod or go.sum are out of date with the code.
      - name: Verify modules are tidy
        run: go mod tidy -diff

      # Run golangci-lint with the pinned version; any finding fails the job.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      # Run all tests with the race detector and write coverage.out and coverage.html.
      - name: Test with race detector and coverage
        run: make test-coverage

      # Compile the API binary to prove the service builds.
      - name: Build
        run: make build

      # Publish the coverage report so reviewers can download it from the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          if-no-files-found: error

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      # Fetch the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the current Node LTS and cache npm downloads keyed on package-lock.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Clean install that fails if package-lock.json is missing or does not match package.json.
      # There is no skip guard on purpose: the frontend exists, so a missing lockfile must fail the job.
      - name: Install dependencies
        run: npm ci

      # Run the TypeScript compiler without emitting; any type error fails the job.
      - name: Type-check
        run: npm run typecheck

      # Run ESLint with zero warnings allowed.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      # Run the unit tests once and write the coverage report to coverage/.
      - name: Test with coverage
        run: npm run test:coverage

      # Produce the production bundle to prove the app builds.
      - name: Build
        run: npm run build

      # Publish the coverage report so reviewers can download it from the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error

  # Builds both images and runs the stack exactly as `make docker-up` does, then probes it over HTTP.
  docker:
    name: Docker (compose smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Fetch the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build and start both services; --wait fails the step if a healthcheck does not pass in 180s.
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 180

      # Probe the app through nginx, the only published port.
      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:8080

          code=$(curl -sS -o body.html -w '%{http_code}' "$base/")
          test "$code" = 200 || { echo "GET / returned $code"; exit 1; }
          grep -qi '<html' body.html || { echo "GET / did not return HTML"; exit 1; }

          code=$(curl -sS -o body.json -w '%{http_code}' "$base/api/v1/operations")
          test "$code" = 200 || { echo "GET /api/v1/operations returned $code"; exit 1; }
          grep -q '^[[:space:]]*[{[]' body.json || { echo "operations did not return JSON"; exit 1; }

          code=$(curl -sS -o calc.json -w '%{http_code}' -X POST "$base/api/v1/calculate" \
            -H 'Content-Type: application/json' \
            -d '{"operation":"add","operands":["0.1","0.2"]}')
          test "$code" = 200 || { echo "POST /api/v1/calculate returned $code"; exit 1; }
          grep -Eq '"result" *: *"0\.3"' calc.json || { echo "unexpected calculate body:"; cat calc.json; exit 1; }

          # 2 MB body: the backend or nginx answers, and either way it must be the JSON error shape.
          head -c 2000000 /dev/zero | tr '\0' 'a' > big.txt
          code=$(curl -sS -o big.json -w '%{http_code}' -X POST "$base/api/v1/calculate" \
            -H 'Content-Type: application/json' --data-binary @big.txt)
          test "$code" = 413 || { echo "oversized body returned $code, want 413"; exit 1; }
          grep -q 'PAYLOAD_TOO_LARGE' big.json || { echo "413 body lacks PAYLOAD_TOO_LARGE:"; cat big.json; exit 1; }

      # Show container output when anything above failed.
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      # Always remove containers and volumes, even after a failure.
      - name: Tear down
        if: always()
        run: docker compose down -v
