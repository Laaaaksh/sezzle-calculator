name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI only reads code and uploads artifacts.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment) so a moved tag cannot change what runs.
env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      # Fetch the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the Go version declared in go.mod and cache modules keyed on go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Generate gomock mocks; test files import them, so this must run before the tidy check, lint and test.
      - name: Generate mocks
        run: make mock

      # Fail if go.mod or go.sum are out of date with the code.
      - name: Verify modules are tidy
        run: go mod tidy -diff

      # Run golangci-lint with the pinned version; any finding fails the job.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      # Run all tests with the race detector and write coverage.out and coverage.html.
      - name: Test with race detector and coverage
        run: make test-coverage

      # Compile the API binary to prove the service builds.
      - name: Build
        run: make build

      # Publish the coverage report so reviewers can download it from the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          if-no-files-found: error

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      # Fetch the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The React app lands in a later phase. Until frontend/package-lock.json exists every step below
      # is skipped, because setup-node's npm cache and npm ci both fail hard without a lockfile.
      - name: Detect frontend app
        id: detect
        run: |
          if [[ -f package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend skipped::frontend/package-lock.json not found; skipping frontend checks."
          fi

      # Install the current Node LTS and cache npm downloads keyed on package-lock.json.
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Clean install that fails if package-lock.json does not match package.json.
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      # Run the TypeScript compiler without emitting; any type error fails the job.
      - name: Type-check
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck

      # Run ESLint with zero warnings allowed.
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint -- --max-warnings=0

      # Run the unit tests once and write the coverage report to coverage/.
      - name: Test with coverage
        if: steps.detect.outputs.present == 'true'
        run: npm run test:coverage

      # Produce the production bundle to prove the app builds.
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build

      # Publish the coverage report so reviewers can download it from the run.
      - if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
