server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide the nginx version from responses.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Bodies up to 2m reach the backend, whose own limit is 1 MiB, so it answers with its documented JSON
    # 413. Anything larger is stopped by nginx itself, and error_page 413 below turns that into the same JSON.
    client_max_body_size 2m;
    error_page 413 @payload_too_large;

    # Docker's embedded DNS. Resolving at request time (through the variable below) means nginx
    # still starts if the backend is not up yet and follows the backend if it restarts with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The API and the health probes live on the backend. The variable keeps the request URI as sent.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass the caller's trace ID through; the backend makes one when it is missing.
        proxy_set_header X-Request-ID $http_x_request_id;
        # Backend request_timeout is 5s; these are slightly above so the backend answers first.
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        # Never cache API answers. The backend's own Cache-Control is dropped and nginx sets the single
        # one, so there is never a duplicate and nginx-made errors (502, 504) carry it too.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # /health/live and /health/ready belong to the backend. Bare /health matches too and gets the
    # backend's JSON 404, instead of falling through to the SPA and returning index.html with 200.
    location ~ ^/health(/|$) {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Same error shape as the backend: {"error":{"code":...,"message":...}}.
    location @payload_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request body is too large."}}';
    }

    # Vite puts a content hash in every file name under /assets/, so a changed file gets a new URL
    # and the old one can be cached for a year. A missing file is a real 404, not index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # These names never change, so the browser must revalidate on every load (cheap 304s).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /theme-init.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single page app: any other path falls back to index.html so a reload on a deep link works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
