# Included in every location that sets its own add_header. nginx drops inherited
# add_header lines as soon as a location defines one, so these must be repeated, not inherited.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Everything is same-origin: scripts, styles and fonts come from the bundle (theme-init.js is an
# external file, so no inline script is needed). data: covers small assets Vite inlines.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
